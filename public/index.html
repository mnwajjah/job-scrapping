<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cocok — Job Matcher & Tracker Otomatis</title>
  <meta name="description" content="Dashboard job scraping otomatis berbasis CV Muhammad Nur Wajjah." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="page login-page">
    <div class="login-box">
      <div class="login-logo">◆</div>
      <h1 class="login-title">Cocok</h1>
      <p class="login-sub">Job Scraper Otomatis</p>
      <form id="loginForm" autocomplete="off">
        <input id="passwordInput" type="password" class="input-field"
          placeholder="Masukkan password" autocomplete="current-password" />
        <div id="loginError" class="error-text hidden"></div>
        <button type="submit" id="btnLogin" class="btn-primary full-width">Masuk</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashPage" class="page dash-page hidden">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <span class="brand-icon">◆</span>
        <span class="brand-name">Cocok</span>
      </div>
      <div class="header-right">
        <div id="cronStatus" class="cron-badge" title="Status cron">
          <span class="cron-dot"></span>
          <span id="cronStatusText">Cron aktif</span>
        </div>
        <button id="btnLogout" class="btn-ghost">Keluar</button>
      </div>
    </header>

    <!-- Main Layout Grid -->
    <div class="dashboard-layout">

      <!-- LEFT SIDEBAR: Scrape Controls -->
      <aside class="sidebar-scrape">
        <h2 class="sidebar-title">🔍 Cari Lowongan Baru</h2>
        
        <div class="field-group">
          <label class="field-label" for="keyword">Kata kunci <span class="opt-badge">opsional</span></label>
          <input id="keyword" type="text" class="input-sm full-width" placeholder="Kosongkan = otomatis dari CV" />
        </div>

        <div class="field-group">
          <label class="field-label" for="location">Lokasi</label>
          <input id="location" type="text" class="input-sm full-width" placeholder="Remote / Batam / Tokyo" />
        </div>

        <div class="field-group">
          <label class="field-label">Sumber Lowongan</label>
          <div id="sourceList" class="source-chips sidebar-sources"></div>
        </div>

        <button id="btnScrape" class="btn-primary full-width" style="margin-top: 16px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Scrape Sekarang
        </button>

        <button id="btnMatch" class="btn-accent full-width hidden" style="margin-top: 8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Analisis CV
        </button>

        <!-- Status bar -->
        <div id="statusBar" class="status-bar hidden" style="margin-top: 16px;">
          <span id="statusText">Memproses…</span>
          <div class="mini-spinner"></div>
        </div>

        <!-- Error -->
        <div id="errorBox" class="error-box hidden" style="margin-top: 16px;"></div>
      </aside>

      <!-- RIGHT PANEL: DB Jobs & Tracker -->
      <main class="main-content">

        <!-- Tracker Stats Summary -->
        <div id="trackerStats" class="tracker-stats">
          <div class="tracker-stat-card"><span class="tracker-stat-num" id="statTotal">0</span><span class="tracker-stat-lbl">Total</span></div>
          <div class="tracker-stat-card"><span class="tracker-stat-num green" id="statHigh">0</span><span class="tracker-stat-lbl">Skor ≥80%</span></div>
          <div class="tracker-stat-card"><span class="tracker-stat-num yellow" id="statActionNeeded">0</span><span class="tracker-stat-lbl">Perlu Tindak</span></div>
          <div class="tracker-stat-card"><span class="tracker-stat-num blue" id="statApplied">0</span><span class="tracker-stat-lbl">Applied</span></div>
          <div class="tracker-stat-card"><span class="tracker-stat-num purple" id="statInterview">0</span><span class="tracker-stat-lbl">Interview</span></div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="toolbar-section">
          <!-- Status Filter Tab Row -->
          <div class="filter-row">
            <button class="tracker-filter active" data-status="all">Semua Status</button>
            <button class="tracker-filter" data-status="pending">⏳ Pending</button>
            <button class="tracker-filter" data-status="applied">📤 Applied</button>
            <button class="tracker-filter" data-status="interview">💬 Interview</button>
            <button class="tracker-filter" data-status="offered">🎉 Offered</button>
            <button class="tracker-filter" data-status="rejected">❌ Rejected</button>
            <button class="tracker-filter" data-status="skipped">🚫 Skip</button>
          </div>

          <div class="filter-controls-row">
            <!-- Score Filter -->
            <div class="filter-group">
              <label class="filter-lbl" for="scoreFilter">Filter Skor AI:</label>
              <select id="scoreFilter" class="select-sm">
                <option value="all">Semua Skor</option>
                <option value="high">Tinggi (≥70%)</option>
                <option value="mid">Sedang (50-69%)</option>
                <option value="low">Rendah (&lt;50%)</option>
                <option value="unscored">Belum dianalisis</option>
              </select>
            </div>

            <!-- Search input -->
            <div class="search-group">
              <input id="searchInput" type="text" class="input-sm" style="width: 260px;" placeholder="Cari posisi, perusahaan, atau tech..." />
            </div>
          </div>
        </div>

        <!-- Tracker status bar (for loading/errors) -->
        <div id="trackerStatusBar" class="status-bar hidden" style="margin-bottom: 16px;">
          <span id="trackerStatusText">Memuat…</span>
          <div class="mini-spinner"></div>
        </div>

        <!-- Jobs List -->
        <div id="trackerList" class="job-list"></div>

        <!-- Empty state -->
        <div id="trackerEmpty" class="empty-state hidden">
          <div class="empty-icon">📋</div>
          <p>Belum ada data lowongan di database.</p>
          <p class="empty-sub">Gunakan panel di sebelah kiri untuk melakukan scrape manual,<br/>atau tunggu Cron otomatis berjalan setiap 5 menit.</p>
        </div>

      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
